<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio | Tarun Teja.P</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"SF Pro Text"', 'Inter', '"Helvetica Neue"', 'Helvetica', 'Arial', 'sans-serif'],
              body: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Text"', 'Inter', '"Helvetica Neue"', 'sans-serif'],
              serif: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', 'Inter', '"Helvetica Neue"', 'sans-serif'],
              display: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', 'Inter', '"Helvetica Neue"', 'sans-serif'],
            },
            colors: {
              background: '#FFFFFF',
              surface: '#F4F4F4',
              primary: {
                400: '#000000',
                500: '#1a1a1a',
                600: '#333333',
                900: '#000000',
              },
              secondary: {
                400: '#9CA3AF',
                500: '#6B7280',
              },
              dark: '#050505',
            },
            cursor: {
                'none': 'none',
            }
          },
        },
      }
    </script>
    <style>
      body {
        background-color: #FFFFFF;
        color: #050505;
        cursor: none;
      }
      
      /* Custom Difference Cursor */
      .cursor-dot,
      .cursor-outline {
        position: fixed;
        top: 0;
        left: 0;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        z-index: 9999;
        pointer-events: none;
        mix-blend-mode: difference;
        will-change: transform, left, top;
      }
      
      .cursor-dot {
        width: 8px;
        height: 8px;
        background-color: #ffffff;
      }
      
      .cursor-outline {
        width: 44px;
        height: 44px;
        border: 1.5px solid #ffffff;
        transition: width 0.25s cubic-bezier(0.16, 1, 0.3, 1), 
                    height 0.25s cubic-bezier(0.16, 1, 0.3, 1), 
                    transform 0.25s cubic-bezier(0.16, 1, 0.3, 1),
                    background-color 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .cursor-outline.hovered {
        width: 64px;
        height: 64px;
        background-color: rgba(255, 255, 255, 0.15);
        border-color: #ffffff;
      }

      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #FFFFFF;
      }
      ::-webkit-scrollbar-thumb {
        background: #000000;
        border-radius: 0px;
      }
      
      .project-row:hover .project-title {
        transform: translateX(20px);
        letter-spacing: -0.02em;
      }
      
      /* Modern Reveal Animations */
      .reveal {
        opacity: 0;
        transform: translateY(40px);
        transition: opacity 1s cubic-bezier(0.16, 1, 0.3, 1), transform 1s cubic-bezier(0.16, 1, 0.3, 1);
        will-change: opacity, transform;
      }
      
      .reveal.active {
        opacity: 1;
        transform: translateY(0);
      }
      
      /* Stagger Delays */
      .delay-100 { transition-delay: 0.1s; }
      .delay-200 { transition-delay: 0.2s; }
      .delay-300 { transition-delay: 0.3s; }
      .delay-400 { transition-delay: 0.4s; }

      /* 3D Floating Animations */
      @keyframes floatCard1 {
        0%, 100% {
          transform: translateY(0px) rotate3d(1, 0, 0, 0deg);
        }
        50% {
          transform: translateY(-12px) rotate3d(1, 0.5, 0, 2deg);
        }
      }

      @keyframes floatCard2 {
        0%, 100% {
          transform: translateY(0px) rotate3d(0, 1, 0, 0deg);
        }
        50% {
          transform: translateY(-16px) rotate3d(0.5, 1, 0, -2.5deg);
        }
      }

      @keyframes floatCard3 {
        0%, 100% {
          transform: translateY(0px) rotate3d(1, 1, 0, 0deg);
        }
        50% {
          transform: translateY(-10px) rotate3d(1, -0.5, 0, 2deg);
        }
      }

      .animate-float-1 {
        animation: floatCard1 7s ease-in-out infinite;
      }

      .animate-float-2 {
        animation: floatCard2 8s ease-in-out infinite 1.2s;
      }

      .animate-float-3 {
        animation: floatCard3 6.5s ease-in-out infinite 2.4s;
      }

      .preserve-3d {
        transform-style: preserve-3d;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",

    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>

</head>

</body>
</html>
