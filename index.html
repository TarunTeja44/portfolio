<!DOCTYPE html>
<html lang="en" class="scroll-smooth dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tarun Teja P. | AI & Software Engineering Portfolio</title>
    <meta name="description" content="Portfolio of Tarun Teja P. — Computer Science sophomore specializing in Machine Learning, NLP Transformers, and Scalable Backend Architectures." />
    
    <!-- Google Fonts: Inter & JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', '"SF Pro Text"', 'Inter', '"Helvetica Neue"', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'SFMono-Regular', 'Menlo', 'Monaco', 'Consolas', 'monospace'],
            },
            colors: {
              background: '#050505',
              surface: '#0d0d0d',
              emerald: {
                400: '#34d399',
                500: '#10b981',
                600: '#059669',
              }
            }
          },
        },
      }
    </script>
    <style>
      body {
        background-color: #050505;
        color: #ffffff;
        cursor: none;
        overflow-x: hidden;
      }
      
      /* Custom Difference Cursor */
      .cursor-dot,
      .cursor-outline {
        position: fixed;
        top: 0;
        left: 0;
        transform: translate(-50%, -50%);
        border-radius: 50%;
        z-index: 9999;
        pointer-events: none;
        will-change: transform, left, top;
      }
      
      .cursor-dot {
        width: 8px;
        height: 8px;
        background-color: #10b981;
        box-shadow: 0 0 10px #10b981;
      }
      
      .cursor-outline {
        width: 44px;
        height: 44px;
        border: 1.5px solid rgba(255, 255, 255, 0.4);
        transition: width 0.25s cubic-bezier(0.16, 1, 0.3, 1), 
                    height 0.25s cubic-bezier(0.16, 1, 0.3, 1), 
                    transform 0.25s cubic-bezier(0.16, 1, 0.3, 1),
                    background-color 0.25s cubic-bezier(0.16, 1, 0.3, 1),
                    border-color 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .cursor-outline.hovered {
        width: 64px;
        height: 64px;
        background-color: rgba(16, 185, 129, 0.12);
        border-color: #10b981;
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 6px;
      }
      ::-webkit-scrollbar-track {
        background: #050505;
      }
      ::-webkit-scrollbar-thumb {
        background: #262626;
        border-radius: 9999px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #10b981;
      }
      
      /* Scroll Reveal Animations */
      .reveal {
        opacity: 0;
        transform: translateY(35px);
        transition: opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1), transform 0.9s cubic-bezier(0.16, 1, 0.3, 1);
        will-change: opacity, transform;
      }
      
      .reveal.active {
        opacity: 1;
        transform: translateY(0);
      }
      
      .delay-100 { transition-delay: 0.1s; }
      .delay-200 { transition-delay: 0.2s; }
      .delay-300 { transition-delay: 0.3s; }
      .delay-400 { transition-delay: 0.4s; }

      /* 3D Floating Animations */
      @keyframes floatCard1 {
        0%, 100% {
          transform: translateY(0px) rotate3d(1, 0, 0, 0deg);
        }
        50% {
          transform: translateY(-12px) rotate3d(1, 0.5, 0, 2deg);
        }
      }

      @keyframes floatCard2 {
        0%, 100% {
          transform: translateY(0px) rotate3d(0, 1, 0, 0deg);
        }
        50% {
          transform: translateY(-16px) rotate3d(0.5, 1, 0, -2.5deg);
        }
      }

      @keyframes floatCard3 {
        0%, 100% {
          transform: translateY(0px) rotate3d(1, 1, 0, 0deg);
        }
        50% {
          transform: translateY(-10px) rotate3d(1, -0.5, 0, 2deg);
        }
      }

      .animate-float-1 {
        animation: floatCard1 7s ease-in-out infinite;
      }

      .animate-float-2 {
        animation: floatCard2 8s ease-in-out infinite 1.2s;
      }

      .animate-float-3 {
        animation: floatCard3 6.5s ease-in-out infinite 2.4s;
      }

      .preserve-3d {
        transform-style: preserve-3d;
      }

      .custom-scrollbar::-webkit-scrollbar {
        width: 4px;
      }
      .custom-scrollbar::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.2);
        border-radius: 4px;
      }
    </style>
    <script type="importmap">
    {
      "imports": {
        "react/": "https://esm.sh/react@^19.2.3/",
        "react": "https://esm.sh/react@^19.2.3",
        "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
        "canvas-confetti": "https://esm.sh/canvas-confetti@^1.9.4",
        "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
      }
    }
    </script>
  </head>
  <body class="antialiased selection:bg-emerald-500 selection:text-black">
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
